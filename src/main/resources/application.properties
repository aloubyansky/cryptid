quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.log.console.format=%-5p [%c{1.}] %s%e%n
# sonar-cryptography logs every detection at INFO
quarkus.log.category."com.ibm".level=WARN
# Extra repositories, in addition to those from ~/.m2/settings.xml, e.g.
#quarkus.maven-resolver.repositories.my-repo.url=https://repo.example.com/maven2
# a single runnable JAR: target/cryptid.jar (finalName and runner suffix are set in the pom)
quarkus.package.jar.type=uber-jar
# remove dependency classes that aren't reachable from the application (experimental)
quarkus.package.jar.tree-shake.mode=classes
# the JAR's list of bundled libraries is META-INF/THIRD-PARTY.txt (license-maven-plugin); drop a
# dependency's own root THIRD-PARTY.txt (com.ethlo.time:itu), which only describes that library
quarkus.package.jar.user-configured-ignored-entries=THIRD-PARTY.txt
